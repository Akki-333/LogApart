# Nothing ran on a commit before this, so nothing stopped a regression reaching
# master. The frontend job proves the app lints and builds. The backend job
# stands up a real MySQL, applies every migration, seeds it, starts the API and
# runs the four live suites against it, because those suites are the only thing
# in this project that tests business rules and they need a running server.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: logapart_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: logapart_ci
      # A throwaway secret that exists only for the length of this job.
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-boot-check
      CORS_ORIGIN: http://localhost:5173
      PORT: 5000
      API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The demo seed is what every suite has been run against locally, so CI
      # gives them the same occupied building rather than twenty empty homes.
      - name: Migrate and seed a fresh database
        run: |
          npm run db:setup
          npm run db:seed:demo

      - name: Start the API
        run: |
          node server.js > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "The API never answered." && cat api.log && exit 1

      # Order matters: nothing that vacates a home may run before a suite that
      # needs one occupied.
      - run: npm run verify:tickets
      - run: npm run verify:trust
      - run: npm run verify:finances
      - run: npm run verify:life

      - name: API log on failure
        if: failure()
        run: cat api.log

  # Proves both images still build. Nothing is pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the API image
        run: docker build -t logapart-api ./backend
      - name: Build the app image
        run: docker build --build-arg VITE_API_URL=https://api.example.test -t logapart-web ./frontend
      - name: The API image starts and answers its health check
        run: |
          docker run -d --name api -p 5000:5000             -e NODE_ENV=development -e DB_NAME=none             -e JWT_SECRET=ci-only-secret-that-is-long-enough-to-pass-the-boot-check             logapart-api
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 1
          done
          docker logs api && exit 1
