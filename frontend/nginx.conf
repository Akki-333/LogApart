server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built assets carry a content hash in their name, so a name never changes
  # meaning and the browser can keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path is a route inside the app, so it gets index.html. That
  # file is never cached, or a deploy stays invisible until a hard refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
