# The whole building in three containers: MySQL, the API and the app.
#
#   create a .env beside this file with the values named below
#   docker compose up -d --build
#   docker compose run --rm api node db/migrate.js
#   docker compose run --rm api node db/seed.js
#
# Nothing secret has a default here. A missing value stops compose with the
# message after the :? rather than starting a building with a blank password.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-logapart}
      MYSQL_USER: ${DB_USER:-logapart}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_NAME: ${DB_NAME:-logapart}
      DB_USER: ${DB_USER:-logapart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # The public address the app is served from. Production refuses localhost.
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
